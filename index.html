{% extends "admin/bars.html.twig" %}

{% block contenpage %}
    <!DOCTYPE html>
<html>
<head>
  <title>Investment Projection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 
</head>
<body>
  <div class="container mt-5">
    <h1>Investment Projection</h1>

    <form id="investmentForm" class="mb-4">
      <div class="form-group">
        <label for="initialAmount">Initial Amount:</label>
        <input type="number" id="initialAmount" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="annualContribution">Annual Contribution:</label>
        <input type="number" id="annualContribution" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="interestRate">Annual Interest Rate (%):</label>
        <input type="number" id="interestRate" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="timePeriod">Time Period (years):</label>
        <input type="number" id="timePeriod" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Calculate</button>
    </form>

    <canvas id="investmentChart"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script> 
  
  <script>
  
  document.getElementById('investmentForm').addEventListener('submit', function(event) {
  event.preventDefault();

  const initialAmount = parseFloat(document.getElementById('initialAmount').value);
  const annualContribution = parseFloat(document.getElementById('annualContribution').value);
  const interestRate = parseFloat(document.getElementById('interestRate').value) / 100;
  const timePeriod = parseInt(document.getElementById('timePeriod').value);

  const investmentData = calculateInvestmentGrowth(initialAmount, annualContribution, interestRate, timePeriod);

  const chartData = {
    labels: investmentData.years,
    datasets: [{
      label: 'Investment Growth',
      data: investmentData.balances,
      fill: false,
      borderColor: 'rgb(75, 192, 192)',
      tension: 0.1
    }]
  };

  const ctx = document.getElementById('investmentChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: chartData
  });
});

function calculateInvestmentGrowth(initialAmount, annualContribution, interestRate, timePeriod) {
  let balance = initialAmount;
  let years = [];
  let balances = [];

  for (let year = 1; year <= timePeriod; year++) {
    balance += annualContribution; 
    balance *= (1 + interestRate); // Compound interest
    years.push(`Year ${year}`);
    balances.push(balance); 
  }

  return { years, balances };
}
</script></body>
</html>
{% endblock %}
